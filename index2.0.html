<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>脊柱健康管理App</title>
    <style>
        /* --- 核心基础样式 --- */
        :root {
            --primary-color: #007AFF;
            --bg-color: #f4f4f7;
            --card-bg: #ffffff;
            --text-main: #333;
            --text-sub: #8e8e93;
            --border-color: #efeff4;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #000; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
        }

        .phone-container {
            width: 100%;
            max-width: 414px;
            height: 100vh;
            background: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            position: relative;
        }

        .bottom-nav {
            height: 70px;
            background: #fff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding-bottom: env(safe-area-inset-bottom);
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #8e8e93;
            font-size: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .nav-item.active { color: #5c6bc0; }
        .nav-icon-text { font-size: 24px; margin-bottom: 2px; }

        .tab-section { display: none; height: 100%; width: 100%; }
        .tab-section.active { display: block; }

        /* --- 训练模块专属样式 --- */
        .search-bar {
            background: #fff;
            padding: 10px 15px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 54px; 
            z-index: 9;
        }
        .search-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 8px 15px;
            font-size: 14px;
            outline: none;
        }
        .search-btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0 15px;
            border-radius: 20px;
            font-size: 14px;
        }
        .train-list { padding: 15px; }
        .train-card {
            background: #fff;
            border-radius: 15px;
            margin-bottom: 15px;
            overflow: hidden;
            display: flex;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .train-img { width: 100px; height: 100px; background: #e3f2fd; display: flex; align-items: center; justify-content: center; font-size: 40px; }
        .train-info { padding: 12px; flex: 1; }
        .train-info h4 { margin: 0 0 5px 0; color: #333; }
        .train-info p { margin: 0; font-size: 12px; color: #8e8e93; line-height: 1.4; }

        header { background: #fff; padding: 15px; text-align: center; font-weight: bold; font-size: 18px; border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 10; }
        .page { display: none; }
        .page.active { display: block; }
        .hospital-card, .report-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin: 10px 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .form-group { background: #fff; padding: 12px 15px; border-radius: 12px; margin: 10px 15px; }
        .form-group label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
        .form-group input, .form-group select { width: 100%; border: none; font-size: 16px; outline: none; background: transparent; }
        .btn, .btn-submit { background: var(--primary-color); color: white; text-align: center; padding: 12px; border-radius: 10px; margin: 20px 15px; cursor: pointer; font-weight: bold; border: none; display: block; text-decoration: none; }
        .user-profile { background: #fff; padding: 30px 20px; display: flex; align-items: center; margin-bottom: 15px; }
        .avatar { width: 70px; height: 70px; border-radius: 50%; margin-right: 20px; display: flex; align-items: center; justify-content: center; font-size: 30px; color: white; background: linear-gradient(135deg, #007AFF, #5AC8FA); }
        .menu-list { background: #fff; margin-bottom: 15px; }
        .menu-item { padding: 15px 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .reminder-box { background: #fff; margin: 15px; padding: 20px; border-radius: 15px; border-left: 5px solid #FF9500; }
        .reminder-date { font-size: 24px; color: #FF9500; font-weight: bold; margin: 10px 0; }
        .back-btn { color: var(--primary-color); position: absolute; left: 15px; cursor: pointer; font-weight: normal; font-size: 15px; }
    </style>
</head>
<body>

<div class="phone-container">
    <div class="main-content">
        
        <section id="tab-detect" class="tab-section">
            <header>检测</header>
            <div style="text-align: center; padding: 100px 20px;">
                <div style="font-size: 60px;">📱</div>
                <p style="color: #999;">检测功能正在集成中...</p>
            </div>
        </section>

        <section id="tab-report" class="tab-section">
            <div id="hospital-page" class="page active">
                <header>选择医院</header>
                <div id="hospital-list"></div>
            </div>
            <div id="reg-page" class="page">
                <header><span class="back-btn" onclick="showReportPage('hospital-page')">〈 返回</span>预约挂号</header>
                <div style="padding-top: 10px;">
                    <p id="selected-hospital-name" style="font-weight: bold; margin: 0 15px 15px 15px; color: var(--primary-color);"></p>
                    <div class="form-group">
                        <label>就诊人</label>
                        <select id="patient">
                            <option value="me">小明</option>
                            <option value="parent">张三</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>联系电话</label>
                        <input type="tel" id="phone" value="13800138000">
                    </div>
                    <div class="form-group">
                        <label>选择历史报告</label>
                        <select id="report">
                            <option value="none">15/02/2026报告</option>
                            <option value="blood">10/11/2025报告</option>
                            <option value="ct">05/08/2026报告</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>预约时间</label>
                        <input type="datetime-local" id="book-time">
                    </div>
                    <button class="btn-submit" style="width: calc(100% - 30px);" onclick="handleRegister()">立即挂号</button>
                </div>
            </div>
        </section>

        <section id="tab-train" class="tab-section">
            <header>康复训练操</header>
            <div class="search-bar">
                <input type="text" id="train-search-input" class="search-input" placeholder="输入姿势，如：施罗斯">
                <button class="search-btn" onclick="searchTrain()">搜索</button>
            </div>
            <div class="train-list" id="train-list-container"></div>
        </section>

        <section id="tab-my" class="tab-section">
            <div id="main-page" class="page active">
                <header>我的</header>
                <div class="user-profile">
                    <div class="avatar">明</div>
                    <div class="user-info">
                        <div class="name" id="display-name">小明</div>
                        <div class="id">ID: 2026030988</div>
                    </div>
                </div>
                <div class="menu-list">
                    <div class="menu-item" onclick="showMyPage('patient-page')">
                        <span class="menu-label">就诊人信息管理</span>
                        <span class="chevron">〉</span>
                    </div>
                    <div class="menu-item" onclick="showMyPage('report-page')">
                        <span class="menu-label">历史报告查询</span>
                        <span class="chevron">〉</span>
                    </div>
                    <div class="menu-item" onclick="calculateReminder()">
                        <span class="menu-label">复诊提醒</span>
                        <span class="chevron">〉</span>
                    </div>
                </div>
            </div>
            <div id="patient-page" class="page">
                <header><span class="back-btn" onclick="showMyPage('main-page')">〈</span>就诊人信息</header>
                <div class="form-container">
                    <div class="form-group"><label>姓名</label><input type="text" id="p-name" value="小明"></div>
                    <div class="form-group"><label>性别</label><input type="text" id="p-gender" value="男"></div>
                    <div class="form-group"><label>年龄</label><input type="number" id="p-age" value="10"></div>
                    <div class="form-group"><label>身份证号</label><input type="text" id="p-idcard" value="3301XXXXXXXXXX001X"></div>
                    <div class="form-group"><label>联系电话</label><input type="tel" id="p-phone" value="13800138000"></div>
                    <div class="btn" onclick="savePatient()">保存修改</div>
                </div>
            </div>
            <div id="report-page" class="page">
                <header><span class="back-btn" onclick="showMyPage('main-page')">〈</span>历史报告</header>
                <div id="report-list-container"></div>
            </div>
            <div id="report-detail-page" class="page">
                <header><span class="back-btn" onclick="showMyPage('report-page')">〈</span>报告详情</header>
                <div class="form-container" id="report-content" style="background: white; margin: 15px; border-radius: 12px; padding: 20px; line-height: 1.8;"></div>
            </div>
            <div id="reminder-page" class="page">
                <header><span class="back-btn" onclick="showMyPage('main-page')">〈</span>复诊提醒</header>
                <div class="reminder-box">
                    <div style="font-size: 14px; color: #666;">根据您最近一次（2026-02-15）的检测报告，智能推算您的下次复诊时间为：</div>
                    <div class="reminder-date" id="next-date">2026-05-15</div>
                    <div style="font-size: 13px; color: #999;">* 复诊周期：建议每 90 天检查一次。</div>
                </div>
                <div class="btn" style="background: #FF9500;" onclick="alert('已加入系统日程，将在复诊前3天提醒您！')">开启短信提醒</div>
            </div>
        </section>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="switchMainTab('tab-detect', this)">
            <span class="nav-icon-text">📱</span><span>检测</span>
        </div>
        <div class="nav-item" onclick="switchMainTab('tab-report', this)">
            <span class="nav-icon-text">📄</span><span>挂号</span>
        </div>
        <div class="nav-item" onclick="switchMainTab('tab-train', this)">
            <span class="nav-icon-text">🏃</span><span>训练</span>
        </div>
        <div class="nav-item active" onclick="switchMainTab('tab-my', this)">
            <span class="nav-icon-text">👤</span><span>我的</span>
        </div>
    </nav>
</div>

<script>
    function switchMainTab(tabId, el) {
        document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
        if(tabId === 'tab-train') renderTrainItems(trainData);
    }

    const hospitals = [
        { name: "浙江大学（紫金港校区）校医院", distance: 1.0 },
        { name: "浙江医院（三墩院区）", distance: 2.3 },
        { name: "浙江大学医学院附属第一医院（庆春院区）", distance: 10.7 },
        { name: "浙江大学医学院附属第二医院（解放路院区）", distance: 11.0 }
    ];

    const hListContainer = document.getElementById('hospital-list');
    hospitals.forEach(h => {
        const div = document.createElement('div');
        div.className = 'hospital-card';
        div.innerHTML = `<div class="h-info"><div class="name">${h.name}</div><div class="dist">距离您 ${h.distance} km</div></div><div class="arrow">〉</div>`;
        div.onclick = () => selectHospital(h.name);
        hListContainer.appendChild(div);
    });

    function showReportPage(pageId) {
        document.getElementById('tab-report').querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
    }

    function selectHospital(name) {
        document.getElementById('selected-hospital-name').innerText = "当前预约：" + name;
        showReportPage('reg-page');
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        tomorrow.setHours(10, 0, 0, 0);
        document.getElementById('book-time').value = tomorrow.toISOString().slice(0, 16);
    }

    function handleRegister() {
        const patient = document.getElementById('patient').options[document.getElementById('patient').selectedIndex].text;
        const time = document.getElementById('book-time').value;
        if(!time) { alert("请选择预约时间"); return; }
        alert(`【挂号模拟成功】\n就诊人：${patient}\n预约时间：${time.replace('T', ' ')}\n请准时前往医院就诊。`);
    }

    const reportData = [
        { id: 1, date: '2026-02-15', title: '脊柱侧弯校内复查', result: '脊柱各段曲度尚可，建议加强腰背肌锻炼。', hospital: 'xxx小学' },
        { id: 2, date: '2025-11-10', title: '社区流动检查', result: '胸椎轻度侧凸，Cobb角约12度。', hospital: 'xxx社区' },
        { id: 3, date: '2025-08-05', title: '脊柱侧弯校内初筛', result: '双肩高度稍有不对称。', hospital: 'xxx小学' }
    ];

    function showMyPage(pageId) {
        document.getElementById('tab-my').querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if(pageId === 'report-page') renderReports();
    }

    function savePatient() {
        const newName = document.getElementById('p-name').value;
        document.getElementById('display-name').innerText = newName;
        alert('信息已更新！');
        showMyPage('main-page');
    }

    function renderReports() {
        const container = document.getElementById('report-list-container');
        container.innerHTML = '';
        reportData.forEach(res => {
            const div = document.createElement('div');
            div.className = 'report-card';
            div.onclick = () => showReportDetail(res);
            div.innerHTML = `<div><div style="font-weight:bold">${res.title}</div><div style="font-size:12px; color:#8e8e93; margin-top:5px;">${res.date} · ${res.hospital}</div></div><div class="chevron">〉</div>`;
            container.appendChild(div);
        });
    }

    function showReportDetail(report) {
        const content = document.getElementById('report-content');
        content.innerHTML = `<h3 style="margin-top:0">${report.title}</h3><p><strong>检查医院：</strong>${report.hospital}</p><p><strong>检查日期：</strong>${report.date}</p><hr style="border:none; border-top:1px solid #eee; margin:15px 0;"><p><strong>检查结论：</strong><br>${report.result}</p><p style="color: #8e8e93; font-size: 12px; margin-top: 30px;">* 本报告仅供参考，请以医生面诊意见为准。</p>`;
        showMyPage('report-detail-page');
    }

    function calculateReminder() {
        const lastReport = reportData[0];
        const lastDate = new Date(lastReport.date);
        const nextDate = new Date(lastDate);
        nextDate.setDate(lastDate.getDate() + 90);
        document.getElementById('next-date').innerText = nextDate.toISOString().split('T')[0];
        showMyPage('reminder-page');
    }

    // --- 训练部分逻辑（已修正） ---
    const trainData = [
        { title: '猫驼式呼吸操', icon: '🧘', desc: '脊柱侧弯初期。改善关节灵活性。' },
        { title: '鸟狗式核心训练', icon: '🤸', desc: '强化核心肌群，增加脊柱稳定性。' },
        { title: '施罗斯侧向呼吸', icon: '🫁', desc: '施罗斯操核心：通过体位呼吸扩张凹侧。' },
        { title: '施罗斯3D矫正练习', icon: '📏', desc: '施罗斯操高级：针对多弧段的精准矫正。' },
        { title: '单杠悬垂牵引', icon: '🏗️', desc: '吊单杠练习：利用重力自然拉伸脊柱。' },
        { title: '单杠侧摆训练', icon: '⚓', desc: '吊单杠进阶：动态缓解肌肉侧向张力。' },
        { title: '标准小燕飞', icon: '🐦', desc: '小燕飞：强化腰背肌，纠正驼背姿态。' },
        { title: '强化版小燕飞', icon: '🚀', desc: '小燕飞进阶：增加保持时间，提升肌肉耐力。' }
    ];

    // 修改：增加 isAppend 参数，默认为 false (清空容器)
    function renderTrainItems(data, isAppend = false) {
        const container = document.getElementById('train-list-container');
        if (!isAppend) {
            container.innerHTML = ''; 
        }
        data.forEach(item => {
            const div = document.createElement('div');
            div.className = 'train-card';
            div.onclick = () => alert('即将播放：' + item.title);
            div.innerHTML = `
                <div class="train-img">${item.icon}</div>
                <div class="train-info">
                    <h4>${item.title}</h4>
                    <p>${item.desc}</p>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function searchTrain() {
        const keyword = document.getElementById('train-search-input').value.trim();
        const container = document.getElementById('train-list-container');
        
        if (!keyword) {
            renderTrainItems(trainData);
            return;
        }

        const filtered = trainData.filter(item => 
            item.title.includes(keyword) || item.desc.includes(keyword)
        );

        if (filtered.length > 0) {
            renderTrainItems(filtered);
        } else {
            // 先写入提示语
            container.innerHTML = `
                <div style="text-align:center; padding:30px; color:#999;">
                    <p>未检索到“${keyword}”相关训练</p>
                    <p style="font-size:12px;">为您推荐以下热门练习：</p>
                </div>
            `;
            // 后调用渲染，但传入 true，表示在后面追加内容，不清空提示语
            renderTrainItems(trainData.slice(0, 3), true);
        }
    }

    switchMainTab('tab-my', document.querySelectorAll('.nav-item')[3]);
</script>

</body>
</html>
